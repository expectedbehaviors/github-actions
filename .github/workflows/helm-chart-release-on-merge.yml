# Reusable workflow: validate chart, then bump version and create GitHub Release on merge to main.
name: Helm chart release on merge (reusable)
on:
  workflow_call:
    inputs:
      chart_path:
        description: "Path to chart directory"
        required: false
        type: string
        default: "."
      helm_repositories:
        description: "Newline-delimited name=url pairs for helm repo add"
        required: false
        type: string
        default: ""
      helm_version:
        description: "Helm version"
        required: false
        type: string
        default: "v3.14.0"
      release_name:
        description: "Release name passed to helm template"
        required: false
        type: string
        default: "release"
      values_files:
        description: "Newline-delimited values file paths relative to chart_path"
        required: false
        type: string
        default: "values.yaml"
      tag_prefix:
        description: "Prefix for version tags (e.g. radarr-v or v)"
        required: false
        type: string
        default: "v"
      initial_version:
        description: "First release version when no tags exist (e.g. 1.0.0)"
        required: false
        type: string
        default: ""
      version_bump:
        description: "patch, minor, major, or auto"
        required: false
        type: string
        default: "patch"
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render chart
        uses: expectedbehaviors/github-actions/.github/actions/helm-chart-validate@main
        with:
          chart_path: ${{ inputs.chart_path }}
          helm_repositories: ${{ inputs.helm_repositories }}
          helm_version: ${{ inputs.helm_version }}
          release_name: ${{ inputs.release_name }}
          values_files: ${{ inputs.values_files }}

  release:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release on merge (create tag and release)
        uses: expectedbehaviors/github-actions/.github/actions/release-on-merge@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ${{ inputs.tag_prefix }}
          initial_version: ${{ inputs.initial_version }}
          version_bump: ${{ inputs.version_bump }}
