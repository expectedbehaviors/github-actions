# Reusable workflow: lint and template a Helm chart (PR validation or pre-release gate).
# Call from chart repos on pull_request and/or as the first stage before release.
name: Helm chart validate (reusable)
on:
  workflow_call:
    inputs:
      chart_path:
        description: "Path to chart directory"
        required: false
        type: string
        default: "."
      helm_repositories:
        description: "Newline-delimited name=url pairs for helm repo add"
        required: false
        type: string
        default: ""
      helm_version:
        description: "Helm version"
        required: false
        type: string
        default: "v3.14.0"
      release_name:
        description: "Release name passed to helm template"
        required: false
        type: string
        default: "release"
      values_files:
        description: "Newline-delimited values file paths relative to chart_path"
        required: false
        type: string
        default: "values.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render chart
        uses: expectedbehaviors/github-actions/.github/actions/helm-chart-validate@main
        with:
          chart_path: ${{ inputs.chart_path }}
          helm_repositories: ${{ inputs.helm_repositories }}
          helm_version: ${{ inputs.helm_version }}
          release_name: ${{ inputs.release_name }}
          values_files: ${{ inputs.values_files }}
