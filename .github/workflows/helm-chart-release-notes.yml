# Reusable workflow: summarize merged PR into GitHub Release notes via OpenAI.
name: Helm chart release notes (reusable)
on:
  workflow_call:
    inputs:
      release_tag:
        description: "Override release tag (workflow_dispatch)"
        required: false
        type: string
        default: ""
      openai_model:
        description: "OpenAI model for summarization"
        required: false
        type: string
        default: "gpt-4o"
      prompt_instruction:
        description: "Extra instruction appended to the default prompt"
        required: false
        type: string
        default: ""
    secrets:
      GITHUB_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update release notes from PR (OpenAI)
        uses: expectedbehaviors/github-actions/.github/actions/release-notes@main
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_tag: ${{ inputs.release_tag }}
          openai_model: ${{ inputs.openai_model }}
          prompt_instruction: ${{ inputs.prompt_instruction }}
