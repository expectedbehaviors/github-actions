name: "Helm chart template"
description: "Render Helm chart manifests to prove templates compile (after dependencies are built)"

inputs:
  chart_path:
    description: "Path to chart directory"
    required: false
    default: "."
  release_name:
    description: "Release name passed to helm template"
    required: false
    default: "release"
  values_files:
    description: "Newline-delimited values file paths relative to chart_path (e.g. values.yaml)"
    required: false
    default: "values.yaml"
  helm_version:
    description: "Helm version (must match helm-lint when run in the same job)"
    required: false
    default: "v3.14.0"

runs:
  using: "composite"
  steps:
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: ${{ inputs.helm_version }}

    - name: Render chart templates
      shell: bash
      run: |
        set -euo pipefail
        chart_path="${{ inputs.chart_path }}"
        release_name="${{ inputs.release_name }}"
        values_args=()
        while IFS= read -r values_file; do
          values_file="$(echo "$values_file" | xargs)"
          if [ -z "$values_file" ]; then
            continue
          fi
          values_args+=("-f" "${chart_path}/${values_file}")
        done <<< "${{ inputs.values_files }}"
        if [ "${#values_args[@]}" -eq 0 ]; then
          helm template "$release_name" "$chart_path" > /dev/null
        else
          helm template "$release_name" "$chart_path" "${values_args[@]}" > /dev/null
        fi
