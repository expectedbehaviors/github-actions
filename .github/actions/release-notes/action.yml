# Composite action: get merged PR body for release tag, summarize via OpenAI, update GitHub Release notes.
# Caller must pass openai_api_key and github_token (e.g. from secrets.OPENAI_API_KEY / secrets.GITHUB_TOKEN).
# On release use event tag; on workflow_dispatch use release_tag input; else latest release.
# Outputs: tag, summary

name: 'Release notes from PR'
description: 'Summarize merged PR as release notes via OpenAI and update GitHub Release body'
inputs:
  openai_api_key:
    description: 'OpenAI API key (pass secrets.OPENAI_API_KEY)'
    required: true
  github_token:
    description: 'GitHub token for gh CLI (pass secrets.GITHUB_TOKEN)'
    required: true
  release_tag:
    description: 'Release tag override (for workflow_dispatch); e.g. v0.1.0'
    required: false
  openai_model:
    description: 'OpenAI model for summarization'
    required: false
    default: 'gpt-4o'
outputs:
  tag:
    description: 'Release tag updated'
    value: ${{ steps.tag.outputs.tag }}
  summary:
    description: 'The summarized release notes text'
    value: ${{ steps.summarize.outputs.summary }}
runs:
  using: 'composite'
  steps:
    - name: Get release tag
      id: tag
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        elif [ -n "${{ inputs.release_tag }}" ]; then
          echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
        else
          TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=1" | jq -r '.[0].tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Find PR merged for this release
      id: pr
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        TAG="${{ steps.tag.outputs.tag }}"
        COMMIT_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" | jq -r '.object.sha')
        PR_BODY=$(gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/pulls" | jq -r '.[0].body // empty' 2>/dev/null || true)
        [ -z "$PR_BODY" ] && PR_BODY="Release $TAG"
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$PR_BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: Summarize release notes (OpenAI)
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        PR_BODY: ${{ steps.pr.outputs.body }}
        OPENAI_MODEL: ${{ inputs.openai_model }}
      id: summarize
      run: |
        echo "$PR_BODY" > /tmp/pr_body.txt
        SUMMARY=$(jq -n --rawfile b /tmp/pr_body.txt --arg model "$OPENAI_MODEL" \
          '{model:$model,messages:[{role:"user",content:("Summarize this PR in 2-4 short bullet points for release notes. Only output the bullets, no preamble.\n\n" + $b)}],max_tokens:300}' \
          | curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- \
          | jq -r '.choices[0].message.content // empty')
        echo "summary<<EOF" >> $GITHUB_OUTPUT
        echo "${SUMMARY:-$PR_BODY}" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: Update release body
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        BODY: ${{ steps.summarize.outputs.summary }}
      run: |
        gh release edit "${{ steps.tag.outputs.tag }}" --notes "$BODY"
      shell: bash