# Composite action: build and push Docker image (Buildx, GHA cache).
# Caller job must: checkout. Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (or use registry inputs).
# On release event uses tag from ref; on workflow_dispatch uses image_tag input; else sha-<short-sha>.
# Outputs: tag (image tag used)

name: 'Docker build and publish'
description: 'Build multi-platform image and push to Docker Hub (or registry)'
inputs:
  image_name:
    description: 'Docker image name (e.g. organizr-tab-controller)'
    required: true
  repo_prefix:
    description: 'Registry/repo prefix (e.g. docker.io/username or expectedbehaviors)'
    required: true
  dockerfile_path:
    description: 'Path to Dockerfile'
    required: false
    default: './docker/Dockerfile'
  context:
    description: 'Build context path'
    required: false
    default: '.'
  platforms:
    description: 'Comma-separated platforms (e.g. linux/amd64,linux/arm64)'
    required: false
    default: 'linux/amd64,linux/arm64'
  image_tag:
    description: 'Override tag (for workflow_dispatch); omit to use release tag or sha-<short-sha>'
    required: false
outputs:
  tag:
    description: 'The image tag that was pushed'
    value: ${{ steps.version.outputs.tag }}
runs:
  using: 'composite'
  steps:
    - name: Set version and tags
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          TAG="${GITHUB_REF#refs/tags/v}"
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
          TAG="${{ inputs.image_tag }}"
        else
          TAG="sha-${GITHUB_SHA::7}"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
      shell: bash

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile_path }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: |
          ${{ inputs.repo_prefix }}/${{ inputs.image_name }}:${{ steps.version.outputs.tag }}
          ${{ inputs.repo_prefix }}/${{ inputs.image_name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
