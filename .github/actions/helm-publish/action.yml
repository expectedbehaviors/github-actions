# Composite action: package Helm chart (version from release tag), set image tag in values, upload .tgz to GitHub Release.
# Updates Chart.yaml (version + appVersion) in the repo to match the released version and pushes the commit so git stays in sync.
# When publish_to_pages is true: enables GitHub Pages (branch gh-pages, path /) via API only if not already configured, then pushes chart index to gh-pages.
# Caller must pass github_token (e.g. secrets.GITHUB_TOKEN). Checkout with fetch-depth: 0 (optional), permissions: contents: write.
# Outputs: tag, version, chart_tarball

name: 'Helm chart publish'
description: 'Package Helm chart with version from release, upload tarball to GitHub Release, sync Chart.yaml to released version'
inputs:
  github_token:
    description: 'GitHub token for gh CLI (pass secrets.GITHUB_TOKEN)'
    required: true
  chart_path:
    description: 'Path to chart directory (e.g. helm)'
    required: false
    default: 'helm'
  chart_name:
    description: 'Chart name for tarball (e.g. organizr-tab-controller)'
    required: true
  values_image_tag_key:
    description: 'yq path to set image tag in values (e.g. organizr-tab-controller.controllers.main.containers.main.image.tag)'
    required: true
  helm_repo_name:
    description: 'Helm repo name for dependency update (e.g. bjw-s)'
    required: false
    default: 'bjw-s'
  helm_repo_url:
    description: 'Helm repo URL for dependency update'
    required: false
    default: 'https://bjw-s-labs.github.io/helm-charts'
  release_tag:
    description: 'Release tag override (for workflow_dispatch); e.g. v0.1.0'
    required: false
  publish_to_pages:
    description: 'If true (default), enable GitHub Pages (gh-pages branch) when needed, then publish chart and index so Helm repo is at https://<owner>.github.io/<repo>. Set to false to skip.'
    required: false
    default: true
outputs:
  tag:
    description: 'Release tag used'
    value: ${{ steps.version.outputs.tag }}
  version:
    description: 'Version string (tag without v prefix)'
    value: ${{ steps.version.outputs.version }}
  chart_tarball:
    description: 'Tarball filename (e.g. chart-0.1.0.tgz)'
    value: ${{ steps.package.outputs.chart_tarball }}
runs:
  using: 'composite'
  steps:
    - name: Set version from release tag
      id: version
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          TAG="${{ github.event.release.tag_name }}"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
          TAG="${{ inputs.release_tag }}"
        else
          TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=1" | jq -r '.[0].tag_name')
        fi
        VERSION="${TAG#v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
      shell: bash

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.14.0'

    - name: Install yq
      run: sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq
      shell: bash

    - name: Prepare chart for release (image tag = chart version)
      run: |
        CHART_SRC="${{ inputs.chart_path }}"
        BUILD_DIR="${RUNNER_TEMP}/helm-publish-build"
        mkdir -p "$BUILD_DIR"
        cp -r "$CHART_SRC" "$BUILD_DIR/chart"
        cd "$BUILD_DIR/chart"
        KEY="${{ inputs.values_image_tag_key }}"
        FIRST="${KEY%%.*}"
        REST="${KEY#*.}"
        YQ_PATH=".\"${FIRST}\".${REST} = strenv(VERSION)"
        yq e "$YQ_PATH" -i values.yaml
        echo "build_dir=$BUILD_DIR" >> $GITHUB_ENV
      env:
        VERSION: ${{ steps.version.outputs.version }}
      shell: bash

    - name: Add dependency and package
      id: package
      run: |
        helm repo add ${{ inputs.helm_repo_name }} ${{ inputs.helm_repo_url }}
        helm dependency update "$BUILD_DIR/chart"
        VERSION="${{ steps.version.outputs.version }}"
        helm package "$BUILD_DIR/chart" --version "$VERSION" --app-version "$VERSION"
        echo "chart_tarball=${{ inputs.chart_name }}-${VERSION}.tgz" >> $GITHUB_OUTPUT
      env:
        BUILD_DIR: ${{ env.build_dir }}
      shell: bash

    - name: Upload chart to GitHub Release
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        gh release upload "${{ steps.version.outputs.tag }}" ${{ inputs.chart_name }}-${{ steps.version.outputs.version }}.tgz --clobber
      shell: bash

    - name: Sync Chart.yaml to released version (keep git in sync)
      run: |
        CHART_PATH="${{ inputs.chart_path }}"
        CHART_YAML="${GITHUB_WORKSPACE}/${CHART_PATH}/Chart.yaml"
        if [ ! -f "$CHART_YAML" ]; then
          echo "Chart.yaml not found at $CHART_YAML, skipping sync"
          exit 0
        fi
        VERSION="${{ steps.version.outputs.version }}"
        yq e ".version = \"$VERSION\" | .appVersion = \"$VERSION\"" -i "$CHART_YAML"
        git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
        git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C "$GITHUB_WORKSPACE" add "${CHART_PATH}/Chart.yaml"
        if git -C "$GITHUB_WORKSPACE" diff --staged --quiet; then
          echo "Chart.yaml already at $VERSION"
        else
          git -C "$GITHUB_WORKSPACE" commit -m "chore(helm): set Chart.yaml version to $VERSION"
          git -C "$GITHUB_WORKSPACE" push origin HEAD
        fi
      shell: bash

    - name: Enable GitHub Pages if not enabled (gh-pages branch)
      if: ${{ inputs.publish_to_pages == 'true' }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        # Only enable Pages when not already configured; do not change existing config.
        # GITHUB_TOKEN often lacks Pages API permission (403); don't fail so we can still push to gh-pages.
        set +e
        if ! gh api "repos/${{ github.repository }}/pages" &>/dev/null; then
          OUT=$(gh api -X POST "repos/${{ github.repository }}/pages" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --input - <<< '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}' 2>&1)
          if [ $? -eq 0 ]; then
            echo "Enabled GitHub Pages (branch: gh-pages, path: /)."
          else
            echo "Could not enable GitHub Pages via API (GITHUB_TOKEN may lack permission): $OUT"
            echo "Enable manually: Settings → Pages → Deploy from branch → branch: gh-pages. Pushing index next."
          fi
        else
          echo "GitHub Pages already configured; skipping."
        fi
      shell: bash

    - name: Publish Helm repo to GitHub Pages
      if: ${{ inputs.publish_to_pages == 'true' }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        TARBALL: ${{ inputs.chart_name }}-${{ steps.version.outputs.version }}.tgz
      run: |
        set -e
        OWNER="${GITHUB_REPOSITORY%/*}"
        REPO="${GITHUB_REPOSITORY#*/}"
        HELM_REPO_URL="https://${OWNER}.github.io/${REPO}"
        if git clone --branch gh-pages --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages_build 2>/dev/null; then
          :
        else
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages_build
          cd pages_build && git checkout --orphan gh-pages && git rm -rf . 2>/dev/null || true && cd ..
        fi
        cd pages_build
        cp "../${TARBALL}" .
        if [ -f index.yaml ]; then
          helm repo index . --url "$HELM_REPO_URL" --merge index.yaml
        else
          helm repo index . --url "$HELM_REPO_URL"
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index.yaml *.tgz
        git diff --staged --quiet && echo "No changes" || git commit -m "helm: add $TARBALL"
        git push origin gh-pages
      shell: bash