# Composite action: run terraform fmt -recursive in the given directory; optionally commit and push.
# Caller must checkout with ref (e.g. github.head_ref for PRs) and grant contents: write.
# Outputs: changed (true|false)

name: 'Terraform fmt'
description: 'Run terraform fmt -recursive; optionally commit and push changes to the current branch'
inputs:
  terraform_dir:
    description: 'Path to Terraform root (e.g. terraform/argocd-config). fmt -recursive runs inside this dir.'
    required: false
    default: 'terraform'
  commit_and_push:
    description: 'If true, commit and push formatting changes'
    required: false
    default: true
  terraform_version:
    description: 'Terraform version'
    required: false
    default: '1.5.0'
outputs:
  changed:
    description: 'true if any .tf files were reformatted'
    value: ${{ steps.fmt.outputs.changed }}
runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: Terraform fmt
      id: fmt
      run: |
        TF_DIR="${{ inputs.terraform_dir }}"
        cd "$TF_DIR"
        terraform fmt -recursive
        cd -
        if [ -n "$(git status -s "$TF_DIR")" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Commit format changes
      if: inputs.commit_and_push == 'true' && steps.fmt.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${{ inputs.terraform_dir }}/"
        git diff --staged --quiet || git commit -m "chore: terraform fmt -recursive"
        git push origin "${{ github.head_ref || github.ref_name }}"
      shell: bash
