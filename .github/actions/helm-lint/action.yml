name: "Helm chart lint"
description: "Install Helm, build dependencies, and lint chart"

inputs:
  chart_path:
    description: "Path to chart directory"
    required: false
    default: "."
  helm_version:
    description: "Helm version"
    required: false
    default: "v3.14.0"

runs:
  using: "composite"
  steps:
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: ${{ inputs.helm_version }}

    - name: Build dependencies and lint chart
      shell: bash
      run: |
        set -euo pipefail
        helm dependency build "${{ inputs.chart_path }}"
        helm lint "${{ inputs.chart_path }}"
