# Composite action: bump patch version, create tag and GitHub Release.
# Requires: default branch is main (or set tag_prefix); tags exist as v* (e.g. v0.1.0).
# Caller job must: checkout with fetch-depth: 0, permissions: contents: write.
# Outputs: tag (e.g. v0.1.1)

name: 'Release on merge to main'
description: 'Bump patch version from latest v* tag and create GitHub Release'
inputs:
  tag_prefix:
    description: 'Prefix for version tags (e.g. v for v0.1.0)'
    required: false
    default: 'v'
outputs:
  tag:
    description: 'The new version tag created (e.g. v0.1.1)'
    value: ${{ steps.version.outputs.tag }}
runs:
  using: 'composite'
  steps:
    - name: Get next version
      id: version
      run: |
        TAG_PREFIX="${{ inputs.tag_prefix }}"
        LATEST=$(git describe --tags --match "${TAG_PREFIX}*" --abbrev=0 2>/dev/null || echo "${TAG_PREFIX}0.0.0")
        LATEST="${LATEST#$TAG_PREFIX}"
        MAJOR="${LATEST%%.*}"
        REST="${LATEST#*.}"
        MINOR="${REST%%.*}"
        PATCH="${REST#*.}"
        [ -z "$MAJOR" ] && MAJOR=0
        [ -z "$MINOR" ] && MINOR=0
        [ -z "$PATCH" ] && PATCH=0
        PATCH=$((PATCH + 1))
        NEXT="${TAG_PREFIX}${MAJOR}.${MINOR}.${PATCH}"
        echo "tag=$NEXT" >> $GITHUB_OUTPUT
        echo "Next version: $NEXT"
      shell: bash

    - name: Create tag and release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        gh release create "$TAG" \
          --title "$TAG" \
          --notes "Auto-release from main. Release notes will be updated shortly." \
          --latest
        echo "Created release $TAG"
      shell: bash
