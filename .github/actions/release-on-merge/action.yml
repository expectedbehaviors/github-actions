# Composite action: bump patch version, create tag and GitHub Release.
# When no tags exist, uses initial_version if set (e.g. 3.0.0), else 0.1.0 so first release is 0.1.1.
# Caller must pass github_token (e.g. secrets.GITHUB_TOKEN). Checkout with fetch-depth: 0, permissions: contents: write.
# Outputs: tag (e.g. v3.0.0 or v0.1.1)

name: 'Release on merge to main'
description: 'Bump patch version from latest tag (default 0.1.0 when none, or initial_version when set) and create GitHub Release'
inputs:
  github_token:
    description: 'GitHub token for gh CLI (pass secrets.GITHUB_TOKEN)'
    required: true
  tag_prefix:
    description: 'Prefix for version tags (e.g. v for v0.1.0)'
    required: false
    default: 'v'
  initial_version:
    description: 'When no tags exist, use this as the first release (e.g. 3.0.0 → v3.0.0). Omit to use 0.1.0 and bump to 0.1.1.'
    required: false
    default: ''
outputs:
  tag:
    description: 'The new version tag created (e.g. v3.0.0 or v0.1.1)'
    value: ${{ steps.version.outputs.tag }}
runs:
  using: 'composite'
  steps:
    - name: Get next version
      id: version
      run: |
        TAG_PREFIX="${{ inputs.tag_prefix }}"
        INITIAL="${{ inputs.initial_version }}"
        EXISTING=$(git describe --tags --match "${TAG_PREFIX}*" --abbrev=0 2>/dev/null || true)
        if [ -z "$EXISTING" ]; then
          if [ -n "$INITIAL" ]; then
            NEXT="${TAG_PREFIX}${INITIAL}"
          else
            NEXT="${TAG_PREFIX}0.1.1"
          fi
        else
          LATEST="${EXISTING#$TAG_PREFIX}"
          MAJOR="${LATEST%%.*}"
          REST="${LATEST#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          [ -z "$MAJOR" ] && MAJOR=0
          [ -z "$MINOR" ] && MINOR=0
          [ -z "$PATCH" ] && PATCH=0
          PATCH=$((PATCH + 1))
          NEXT="${TAG_PREFIX}${MAJOR}.${MINOR}.${PATCH}"
        fi
        echo "tag=$NEXT" >> $GITHUB_OUTPUT
        echo "Next version: $NEXT"
      shell: bash

    - name: Create tag and release
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        gh release create "$TAG" \
          --title "$TAG" \
          --notes "Auto-release from main. Release notes will be updated shortly." \
          --latest
        echo "Created release $TAG"
      shell: bash
